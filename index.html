<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshField - Online Grocery</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

/* General Reset */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

:root{
--primary-color:#2ecc71;
--dark-color:#27ae60;
--text-color:#333;
}

body{
background:#f9f9f9;
color:var(--text-color);
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:1rem 5%;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.logo{
font-size:1.5rem;
font-weight:bold;
color:var(--primary-color);
}

.nav-links{
list-style:none;
display:flex;
gap:20px;
}

.nav-links a{
text-decoration:none;
color:var(--text-color);
}

.cart-icon{
position:relative;
cursor:pointer;
}

#cart-count{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
border-radius:50%;
padding:2px 6px;
font-size:0.8rem;
}

/* Hero */

.hero{
background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
url('https://images.unsplash.com/photo-1542838132-92c53300491e');
background-size:cover;
height:60vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero button{
padding:10px 20px;
background:var(--primary-color);
color:white;
border:none;
cursor:pointer;
}

/* Products */

.container{
padding:2rem 5%;
}

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.product-card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.product-card img{
width:100px;
}

.price{
color:var(--dark-color);
font-weight:bold;
}

.add-btn{
background:var(--primary-color);
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

/* Cart */

.cart-sidebar{
position:fixed;
top:0;
right:-300px;
width:300px;
height:100%;
background:white;
box-shadow:-2px 0 5px rgba(0,0,0,0.1);
transition:0.3s;
display:flex;
flex-direction:column;
}

.cart-sidebar.active{
right:0;
}

.cart-header{
background:var(--primary-color);
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}

.cart-items{
flex:1;
padding:15px;
}

.cart-footer{
padding:15px;
border-top:1px solid #eee;
}

.checkout-btn{
width:100%;
padding:10px;
background:var(--dark-color);
color:white;
border:none;
}

footer{
text-align:center;
padding:20px;
background:#333;
color:white;
}

</style>
</head>

<body>

<nav>
<div class="logo">FreshField</div>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#products">Products</a></li>
<li><a href="#">Contact</a></li>
</ul>

<div class="cart-icon" onclick="toggleCart()">
<i class="fas fa-shopping-cart"></i>
<span id="cart-count">0</span>
</div>

</nav>


<header class="hero">
<div>
<h1>Fresh Groceries Delivered to You</h1>
<p>Best quality organic food</p>
<button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</div>
</header>


<section id="products" class="container">

<h2>Our Products</h2>

<div class="product-grid" id="product-list"></div>

</section>


<div class="cart-sidebar" id="cart-sidebar">

<div class="cart-header">
<h3>Your Cart</h3>
<span onclick="toggleCart()">X</span>
</div>

<div class="cart-items" id="cart-items">
<p>Your cart is empty.</p>
</div>

<div class="cart-footer">
<h4>Total: $<span id="cart-total">0</span></h4>
<button class="checkout-btn" onclick="checkout()">Checkout</button>
</div>

</div>


<footer>
<p>© 2026 FreshField Grocery Project</p>
</footer>


<script>

const products=[
{id:1,name:"Organic Apples",price:2.50,img:"https://cdn-icons-png.flaticon.com/512/415/415733.png"},
{id:2,name:"Fresh Milk",price:3.00,img:"https://cdn-icons-png.flaticon.com/512/725/725085.png"},
{id:3,name:"Whole Bread",price:2.00,img:"https://cdn-icons-png.flaticon.com/512/1086/1086581.png"},
{id:4,name:"Bananas",price:1.20,img:"https://cdn-icons-png.flaticon.com/512/1135/1135543.png"},
{id:5,name:"Carrots",price:1.50,img:"https://cdn-icons-png.flaticon.com/512/1202/1202125.png"},
{id:6,name:"Eggs",price:4.50,img:"https://cdn-icons-png.flaticon.com/512/713/713299.png"}
];

let cart=[];

const productList=document.getElementById("product-list");

function displayProducts(){

products.forEach(product=>{

const div=document.createElement("div");

div.classList.add("product-card");

div.innerHTML=`
<img src="${product.img}">
<h3>${product.name}</h3>
<p class="price">$${product.price}</p>
<button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
`;

productList.appendChild(div);

});

}

function addToCart(id){

const product=products.find(p=>p.id===id);

const item=cart.find(i=>i.id===id);

if(item){

item.quantity++;

}

else{

cart.push({...product,quantity:1});

}

updateCart();

document.getElementById("cart-sidebar").classList.add("active");

}

function updateCart(){

const cartItems=document.getElementById("cart-items");

const cartCount=document.getElementById("cart-count");

const cartTotal=document.getElementById("cart-total");

cartCount.innerText=cart.reduce((a,b)=>a+b.quantity,0);

const total=cart.reduce((a,b)=>a+(b.price*b.quantity),0);

cartTotal.innerText=total.toFixed(2);

cartItems.innerHTML="";

if(cart.length===0){

cartItems.innerHTML="<p>Your cart is empty</p>";

}

else{

cart.forEach(item=>{

const div=document.createElement("div");

div.innerHTML=`${item.name} (x${item.quantity}) - $${(item.price*item.quantity).toFixed(2)}`;

cartItems.appendChild(div);

});

}

}

function toggleCart(){

document.getElementById("cart-sidebar").classList.toggle("active");

}

function checkout(){

if(cart.length>0){

alert("Order placed successfully!");

cart=[];

updateCart();

toggleCart();

}

else{

alert("Cart is empty");

}

}

displayProducts();

</script>

</body>
</html>
